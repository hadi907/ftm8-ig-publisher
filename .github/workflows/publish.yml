name: Publish Instagram posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = publish due posts, check = test the token"
        default: run

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow
      - name: Configure git
        run: |
          git config user.name "ig-publisher"
          git config user.email "actions@users.noreply.github.com"
      - name: Publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then
            python publish.py check
          else
            python publish.py
          fi
      - name: Save results
        run: |
          git add -A
          git diff --cached --quiet || (git commit -qm "update schedule [skip ci]" && git pull -q --rebase && git push -q)
