name: Publish Instagram posts

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = publish due posts, check = test the token"
        default: run

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow cryptography
      - name: Configure git
        run: |
          git config user.name "ig-publisher"
          git config user.email "actions@users.noreply.github.com"
      - name: Publish
        id: publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then
            python publish.py check
          else
            python publish.py
          fi
      - name: Save results
        if: always()
        run: |
          git add -A -- . ':!failures.txt'
          git reset -q failures.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "update schedule [skip ci]" && git pull -q --rebase && git push -q)
      - name: Report failures
        if: always()
        run: |
          if [ "${{ steps.publish.outcome }}" = "failure" ]; then
            echo "## ❌ تعطل الناشر" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ -f failures.txt ]; then
            echo "## ❌ منشورات انستغرام لم تُنشر" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- /' failures.txt >> "$GITHUB_STEP_SUMMARY"
            cat failures.txt
            exit 1
          fi
